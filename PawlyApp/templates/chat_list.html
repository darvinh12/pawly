{% extends "base_app.html" %}
{% load static i18n %}

{% block body_class %}layout-app has-tabbar{% endblock %}

{% block content %}
    <div class="chat-layout">
      <section class="chat-list" aria-labelledby="chat-list-title">
        <div class="section-head">
          <h1 class="title-2" id="chat-list-title">{% trans "Mensajes" %}</h1>
          <a class="icon-btn icon-btn--bordered" href="{% url 'user_profile' 1 %}" aria-label="{% trans 'Nueva conversación' %}"><svg class="icon" aria-hidden="true"><use href="{% static 'img/icons/edit.svg' %}#icon"/></svg></a>
        </div>
        <form class="search-box search-box--page" action="{% url 'chat_list' %}" role="search" aria-label="{% trans 'Buscar conversación' %}">
          <svg class="icon icon--sm" aria-hidden="true"><use href="{% static 'img/icons/search.svg' %}#icon"/></svg>
          <label class="visually-hidden" for="chat-search">{% trans "Buscar conversación" %}</label>
          <input id="chat-search" name="q" type="search" placeholder="{% trans 'Buscar conversación' %}">
        </form>

        <h2 class="eyebrow">{% trans "Chats" %}</h2>
        {% include "chat_items.html" %}
      </section>
      <section class="chat-panel desktop-only--flex" aria-label="{% trans 'Conversación' %}">
        <ol class="chat-panel__messages">
          <li class="sysmsg">{% trans "Elige una conversación para ver los mensajes" %}</li>
        </ol>
      </section>
    </div>
{% endblock %}
